<!doctype html>
<!-- SPDX-License-Identifier: GPL-3.0-or-later -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wireless Lab</title>
<style>
  /* Quiet, paper-like chrome: warm canvas, white cards, hairlines, one blue accent. */
  :root {
    --canvas: #f6f5f4; --surface: #ffffff; --hairline: #e6e6e6;
    --ink: #000000; --ink-2: #31302e; --ink-muted: #615d59; --ink-faint: #a39e98;
    --primary: #0075de; --primary-soft: rgba(0, 117, 222, 0.08);
    --ok: #1aae39; --warn: #dd5b00; --bad: #c4321f;
    --band: rgba(221, 91, 0, 0.10); --grid: #efeeec;
    --shadow: rgba(0,0,0,0.01) 0 0.175px 1.041px, rgba(0,0,0,0.02) 0 0.8px 2.925px,
              rgba(0,0,0,0.027) 0 2.025px 7.847px, rgba(0,0,0,0.04) 0 4px 18px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --canvas: #191918; --surface: #202020; --hairline: #2f2f2e;
      --ink: #f1f0ee; --ink-2: #d6d3cf; --ink-muted: #a39e98; --ink-faint: #75716c;
      --primary: #4a9cec; --primary-soft: rgba(74, 156, 236, 0.14);
      --ok: #3ccb5a; --warn: #f08a3c; --bad: #f0705e;
      --band: rgba(240, 138, 60, 0.16); --grid: #2a2a29;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--canvas); color: var(--ink);
         font: 400 15px/1.33 Inter, -apple-system, system-ui, "Segoe UI", Helvetica, Arial, sans-serif;
         font-feature-settings: "lnum"; -webkit-font-smoothing: antialiased; }
  header { display: flex; align-items: baseline; gap: 12px; padding: 16px 24px;
           background: var(--surface); border-bottom: 1px solid var(--hairline);
           position: sticky; top: 0; z-index: 1; }
  header h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.25px; margin: 0; }
  header span { color: var(--ink-faint); font-size: 12px; overflow: hidden; text-overflow: ellipsis;
                white-space: nowrap; }
  .layout { display: grid; grid-template-columns: 296px 1fr; min-height: calc(100vh - 57px);
            max-width: 1300px; margin: 0 auto; }
  aside { padding: 16px 12px 32px 24px; overflow: auto; }
  main { padding: 28px 24px 48px; min-width: 0; }
  h2 { font-size: 12px; font-weight: 600; letter-spacing: 0.125px; color: var(--ink-muted);
       margin: 20px 12px 8px; }
  .run { display: block; width: 100%; text-align: left; border: 0; background: none; color: inherit;
         font: inherit; padding: 8px 12px; border-radius: 5px; cursor: pointer;
         box-shadow: inset 2px 0 0 transparent; }
  .run:active { background: var(--hairline); }
  .run[aria-current="true"] { background: var(--primary-soft); box-shadow: inset 2px 0 0 var(--primary); }
  .run:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
  .run b { display: block; font-weight: 600; text-transform: capitalize; }
  .run small { color: var(--ink-faint); font-size: 12px; }
  .badge { font-size: 12px; font-weight: 600; letter-spacing: 0.125px; line-height: 1.33;
           padding: 2px 8px; border-radius: 9999px; background: var(--surface);
           border: 1px solid var(--hairline); margin-left: 8px; vertical-align: 2px;
           white-space: nowrap; text-transform: none; }
  .badge::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%;
                   background: currentColor; margin-right: 6px; vertical-align: 1px; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  .device { padding: 8px 12px; }
  .device b { font-weight: 600; }
  .device ul { list-style: none; margin: 4px 0 0; padding: 0; font-size: 13px; }
  .device li { color: var(--ink-faint); }
  .device li.yes { color: var(--ink-2); }
  .chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px;
           margin: 20px 0 24px; }
  .chip { background: var(--surface); border: 1px solid var(--hairline); border-radius: 8px;
          padding: 12px 16px; font-size: 16px; font-weight: 600; letter-spacing: -0.125px; }
  .chip small { display: block; color: var(--ink-muted); font-size: 12px; font-weight: 600;
                letter-spacing: 0.125px; margin-bottom: 4px; }
  .card { background: var(--surface); border: 1px solid var(--hairline); border-radius: 12px;
          padding: 24px 24px 16px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .card h3 { font-size: 20px; font-weight: 600; letter-spacing: -0.125px; line-height: 1.4;
             margin: 0 0 12px; text-transform: capitalize; }
  .card h3 small { display: block; color: var(--ink-muted); font-size: 14px; font-weight: 400;
                   letter-spacing: 0; text-transform: none; }
  canvas { width: 100%; height: 200px; display: block; }
  .empty { color: var(--ink-faint); padding: 48px 0; text-align: center; }
  .title { font-size: 40px; font-weight: 700; line-height: 1.1; letter-spacing: -1px; margin: 0;
           text-transform: capitalize; }
  .title .badge { vertical-align: 9px; }
  .legend { color: var(--ink-muted); font-size: 14px; margin: -8px 0 16px; }
  .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 4px;
            background: var(--band); border: 1px solid var(--warn); vertical-align: -1px;
            margin-right: 6px; }
  @media (max-width: 840px) {
    .layout { grid-template-columns: 1fr; }
    aside { padding: 8px 12px 0; }
    main { padding: 20px 16px 40px; }
    .title { font-size: 26px; letter-spacing: -0.625px; }
  }
</style>
</head>
<body>
<header><h1>Wireless Lab</h1><span id="version"></span></header>
<div class="layout">
  <aside>
    <h2>Runs</h2>
    <div id="runs"><div class="empty">Loading…</div></div>
    <h2>Devices</h2>
    <div id="devices"></div>
  </aside>
  <main id="main"><div class="empty">Select a run on the left.</div></main>
</div>
<script>
"use strict";
const LABELS = {
  rtt_ms: ["Latency", "ms"], rssi_dbm: ["Signal strength", "dBm"], noise_dbm: ["Noise", "dBm"],
  snr_db: ["Signal above noise", "dB"], tx_rate_mbps: ["Link rate", "Mbps"],
  down_mbps: ["Download", "Mbps"], up_mbps: ["Upload", "Mbps"], channel: ["Channel", ""],
  band_ghz: ["Band", "GHz"], width_mhz: ["Channel width", "MHz"],
};
const el = (tag, props = {}, ...children) => {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children);
  return node;
};
const getJSON = async (url) => {
  const response = await fetch(url);
  if (!response.ok) throw new Error(`${url}: HTTP ${response.status}`);
  return response.json();
};
const fmt = (v) => Number.isInteger(v) ? String(v) : Math.abs(v) >= 100 ? v.toFixed(0) : Math.abs(v) >= 10 ? v.toFixed(1) : v.toFixed(2);
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

function badge(run) {
  if (!run.sealed) return el("span", { className: "badge warn", textContent: "not sealed",
    title: "The run did not end normally; data may be incomplete." });
  if (!run.intact) return el("span", { className: "badge bad", textContent: "modified",
    title: "Content does not match the seal." });
  return el("span", { className: "badge ok", textContent: "verified",
    title: "Complete and unmodified." });
}
const when = (iso) => iso ? new Date(iso).toLocaleString() : "";

async function loadRuns() {
  const box = document.getElementById("runs");
  const { runs } = await getJSON("/api/runs");
  box.replaceChildren();
  if (!runs.length) {
    box.append(el("div", { className: "empty", textContent: "No runs yet. Try: wls diagnose" }));
    return;
  }
  for (const run of runs) {
    const button = el("button", { className: "run" },
      el("b", {}, run.kind, badge(run)), el("small", { textContent: when(run.started_utc) }));
    button.onclick = () => showRun(run.name, button);
    box.append(button);
  }
  box.firstElementChild.click();
}

async function loadDevices() {
  const box = document.getElementById("devices");
  const { devices } = await getJSON("/api/devices");
  box.replaceChildren(...devices.map((d) => el("div", { className: "device" },
    el("b", { textContent: d.name }),
    el("ul", {}, ...d.capabilities.map((c) => el("li", {
      className: c.supported ? "yes" : "", title: c.reason,
      textContent: (c.supported ? "✓ " : "– ") + c.name.replaceAll("_", " "),
    }))))));
}

function testBands(events, duration) {
  const bands = []; let start = null;
  for (const e of events) {
    if (e.kind !== "state") continue;
    if (e.label === "test_running" && start === null) start = e.t;
    else if (start !== null && e.label !== "test_running") { bands.push([start, e.t]); start = null; }
  }
  if (start !== null) bands.push([start, duration]);
  return bands;
}

function draw(canvas, points, duration, bands, marks) {
  const ratio = window.devicePixelRatio || 1;
  const width = canvas.clientWidth, height = canvas.clientHeight;
  canvas.width = width * ratio; canvas.height = height * ratio;
  const g = canvas.getContext("2d"); g.scale(ratio, ratio);
  const pad = { l: 46, r: 10, t: 8, b: 22 };
  const values = points.map((p) => p[1]);
  let lo = Math.min(...values), hi = Math.max(...values);
  if (lo === hi) { lo -= 1; hi += 1; }
  const margin = (hi - lo) * 0.1; lo -= margin; hi += margin;
  const span = Math.max(duration, 1e-9);
  const x = (t) => pad.l + (t / span) * (width - pad.l - pad.r);
  const y = (v) => pad.t + (1 - (v - lo) / (hi - lo)) * (height - pad.t - pad.b);

  g.fillStyle = css("--band");
  for (const [a, b] of bands) g.fillRect(x(a), pad.t, Math.max(x(b) - x(a), 1), height - pad.t - pad.b);

  g.font = "11px system-ui, sans-serif"; g.fillStyle = css("--ink-muted");
  g.strokeStyle = css("--grid"); g.lineWidth = 1;
  g.textAlign = "right"; g.textBaseline = "middle";
  for (let i = 0; i <= 3; i++) {
    const v = lo + ((hi - lo) * i) / 3;
    g.beginPath(); g.moveTo(pad.l, y(v)); g.lineTo(width - pad.r, y(v)); g.stroke();
    g.fillText(fmt(v), pad.l - 6, y(v));
  }
  g.textAlign = "center"; g.textBaseline = "top";
  for (let i = 0; i <= 4; i++) {
    const t = (span * i) / 4;
    g.fillText(`${t.toFixed(t < 10 ? 1 : 0)} s`, Math.min(Math.max(x(t), pad.l + 12), width - 16), height - pad.b + 5);
  }
  g.strokeStyle = css("--ink-muted"); g.setLineDash([3, 3]);
  for (const t of marks) { g.beginPath(); g.moveTo(x(t), pad.t); g.lineTo(x(t), height - pad.b); g.stroke(); }
  g.setLineDash([]);

  g.strokeStyle = css("--primary"); g.fillStyle = css("--primary"); g.lineWidth = 1.6; g.lineJoin = "round";
  g.beginPath();
  points.forEach(([t, v], i) => (i ? g.lineTo(x(t), y(v)) : g.moveTo(x(t), y(v))));
  g.stroke();
  if (points.length <= 60) for (const [t, v] of points) { g.beginPath(); g.arc(x(t), y(v), 2.2, 0, 7); g.fill(); }
}

const stats = (values) => ({
  min: Math.min(...values), max: Math.max(...values),
  avg: values.reduce((a, b) => a + b, 0) / values.length,
});

async function showRun(name, button) {
  document.querySelectorAll(".run").forEach((b) => b.removeAttribute("aria-current"));
  button.setAttribute("aria-current", "true");
  const main = document.getElementById("main");
  let run;
  try { run = await getJSON(`/api/runs/${encodeURIComponent(name)}`); }
  catch (error) { main.replaceChildren(el("div", { className: "empty", textContent: String(error) })); return; }

  const chips = el("div", { className: "chips" });
  const chip = (label, value) => chips.append(el("div", { className: "chip" }, el("small", { textContent: label }), value));
  chip("Started", when(run.started_utc));
  chip("Duration", `${run.duration.toFixed(1)} s`);
  chip("Samples", String(run.sample_count));

  const bands = testBands(run.events, run.duration);
  const marks = run.events.filter((e) => e.kind === "mark").map((e) => e.t);
  const cards = [];
  for (const s of run.series) {
    const values = s.points.map((p) => p[1]);
    const { min, max, avg } = stats(values);
    if (s.metric === "lost") { chip(`${s.probe} · packet loss`, `${(100 * avg).toFixed(1)} %`); continue; }
    if (s.metric === "associated") { chip(`${s.probe} · connected`, `${(100 * avg).toFixed(0)} % of the time`); continue; }
    const [label, unit] = LABELS[s.metric] || [s.metric, ""];
    if (min === max) { chip(`${s.probe} · ${label}`, `${fmt(min)} ${unit}`.trim()); continue; }
    const canvas = el("canvas");
    const card = el("div", { className: "card" },
      el("h3", {}, `${s.probe} · ${label}`,
        el("small", { textContent: `min ${fmt(min)} · avg ${fmt(avg)} · max ${fmt(max)} ${unit}` })),
      canvas);
    cards.push([canvas, s.points, card]);
  }
  const title = el("h1", { className: "title" }, run.kind, badge(run));
  const nodes = [title, chips];
  if (bands.length || marks.length) nodes.push(el("div", { className: "legend" },
    el("span", { className: "swatch" }), "test active", marks.length ? "  ·  dashed line: mark" : ""));
  nodes.push(...cards.map((c) => c[2]));
  if (!cards.length) nodes.push(el("div", { className: "empty", textContent: "Nothing varied during this run." }));
  main.replaceChildren(...nodes);
  const redraw = () => cards.forEach(([canvas, points]) => draw(canvas, points, run.duration, bands, marks));
  redraw();
  window.onresize = redraw;
}

getJSON("/api/info").then((i) => { document.getElementById("version").textContent = `v${i.version} · ${i.runs_dir}`; });
loadRuns().catch((e) => { document.getElementById("runs").textContent = String(e); });
loadDevices().catch(() => {});
</script>
</body>
</html>
