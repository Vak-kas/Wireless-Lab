[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nrtrail"
version = "0.1.0"
description = "5G NR(NTN 포함) 기지국 신호를 단계별로 따라가는 수신 전용 로컬 도구"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12",
    "pydantic>=2.6",
    "numpy>=1.26",
    "pycrate>=0.7",
    # 컴퓨터의 블루투스·Wi-Fi 어댑터를 장비로 쓸 때 (server/nrtrail/adapters.py). 없어도 나머지는 돈다.
    "bleak>=0.22",
    "pyobjc-framework-CoreWLAN>=10; sys_platform == 'darwin'",
    "pyobjc-framework-CoreLocation>=10; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx2",
    "ruff>=0.5",
    "mypy>=1.10",
    "datamodel-code-generator>=0.25",
    "pyyaml>=6",
]
# 프로그램처럼 창으로 띄울 때 (tools/app.py, nrtrail.app). 없으면 기본 브라우저로 연다.
app = ["pywebview>=5"]

[tool.setuptools.packages.find]
where = ["server"]
include = ["nrtrail*"]

[tool.pytest.ini_options]
testpaths = ["server/tests"]
addopts = "-q -m 'not matlab'"
markers = ["matlab: 실제 MATLAB을 띄우는 느린 테스트 (pytest -m matlab)"]
filterwarnings = ["ignore:.*on_event is deprecated.*:DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["server/nrtrail/contracts_gen.py", "Wireless-Lab-Basic", "Wireless-Lab-Pro"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["server/nrtrail"]
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["contracts_gen\\.py$"]
plugins = ["pydantic.mypy"]
